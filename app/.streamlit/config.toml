[server]
maxUploadSize = 50

[client]
toolbarMode = "minimal"

[theme]
base = "light"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap, sans-serif"
headingFont = "Plus Jakarta Sans, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["2.25rem", "1.375rem", "1.0625rem", "1rem", "0.9375rem", "0.875rem"]
baseFontSize = 15
primaryColor = "#1E6B5C"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#F2F0EB"
textColor = "#1D2725"
borderColor = "#E5E2DA"
showWidgetBorder = true
baseRadius = "0.625rem"
buttonRadius = "0.625rem"
linkColor = "#1E6B5C"
linkUnderline = false
redColor = "#C2453D"
orangeColor = "#C77A12"
yellowColor = "#C99A1A"
blueColor = "#2F6FB0"
greenColor = "#2F855A"
violetColor = "#6E56C2"
grayColor = "#8B918F"
codeBackgroundColor = "#F2F0EB"
dataframeBorderColor = "#E5E2DA"
dataframeHeaderBackgroundColor = "#F4F2ED"
metricValueFontSize = "1.75rem"
metricValueFontWeight = 650
chartCategoricalColors = ["#3F6FD1", "#1B9E77", "#E08A1E", "#D6456B", "#7B5BD6"]

[theme.sidebar]
backgroundColor = "#F4F2ED"
